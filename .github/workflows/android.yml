name: Build Xcology AI Live APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Xcology repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download pinned official AI camera example
        run: |
          git clone https://github.com/DecartAI/decart-example-android-realtime.git ai-source
          git -C ai-source checkout --detach 634559e75ddc950546624878c0a174ecde47553f
          test -f ai-source/app/build.gradle.kts
          test -f ai-source/app/src/main/java/ai/decart/example/MainViewModel.kt
          test -f ai-source/app/src/main/java/ai/decart/example/ui/CameraScreen.kt

      - name: Apply Xcology AI app overrides
        run: |
          cp xcology-ai/overrides/MainViewModel.kt ai-source/app/src/main/java/ai/decart/example/MainViewModel.kt
          cp xcology-ai/overrides/CameraScreen.kt ai-source/app/src/main/java/ai/decart/example/ui/CameraScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          def edit(rel, old, new):
              p = Path("ai-source") / rel
              data = p.read_text()
              count = data.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {rel}, got {count}: {old}")
              p.write_text(data.replace(old, new))
          edit("app/build.gradle.kts", 'applicationId = "ai.decart.example"', 'applicationId = "com.xcology.livecamera.ai"')
          edit("app/build.gradle.kts", 'versionName = "1.0"', 'versionName = "1.1-xcology-ai"')
          edit("app/src/main/res/values/strings.xml", "Decart Example", "Xcology AI Live")
          edit("app/src/main/AndroidManifest.xml", 'android:allowBackup="true"', 'android:allowBackup="false"')
          edit("app/src/main/java/ai/decart/example/MainActivity.kt",
              '        super.onCreate(savedInstanceState)',
              '        super.onCreate(savedInstanceState)\n        window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)')
          PY
          grep -q "streamShareToken" ai-source/app/src/main/java/ai/decart/example/MainViewModel.kt
          grep -q "setReferenceImage" ai-source/app/src/main/java/ai/decart/example/MainViewModel.kt
          grep -q "Xcology" ai-source/app/src/main/java/ai/decart/example/ui/CameraScreen.kt

      - name: Compile Android APK
        working-directory: ai-source
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Xcology-AI-Live-APK
          path: ai-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
