name: Build Xcology APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Extract Xcology Project
        run: |
          unzip -o -q Xcology-Live-Camera-v0.4-Multiclass-Skin-AI.zip
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Fix Gradle Kotlin Imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/build.gradle.kts")
          code = file.read_text()

          code = code.replace(
              "java.net.URI(",
              "URI("
          )

          code = code.replace(
              "java.security.MessageDigest",
              "MessageDigest"
          )

          code = (
              "import java.net.URI\n"
              "import java.security.MessageDigest\n\n"
              + code
          )

          file.write_text(code)
          PY
      - name: Fix Camera Permission Callback
        run: |
          sed -i 's/Array<out String>/Array<String>/' app/src/main/java/com/xcology/livecamera/MainActivity.kt
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xcology-v0.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
